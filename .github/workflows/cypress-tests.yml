name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress UI tests
        uses: cypress-io/github-action@v7
        with:
          start: python3 -m http.server 5500
          wait-on: http://127.0.0.1:5500/app/
          wait-on-timeout: 120
          spec: cypress/e2e/previsao-tempo.cy.js
          browser: chrome

  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04

    env:
      CYPRESS_REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Cypress API tests
        run: npx cypress run --config-file cypress.api.config.js --spec "cypress/e2e/api-usuarios.cy.js"